<html>
<head>
  <title>Silver Choir Background</title>
  <link type="text/css" rel="stylesheet" href="background.css" />
</head>
<body>
  <!-- Decorative only. All text, navigation and input are native UMG widgets. -->
  <div id="viewport-frame" class="screen">
    <div class="grid grid-v grid-v1"></div>
    <div class="grid grid-v grid-v2"></div>
    <div class="grid grid-v grid-v3"></div>
    <div class="grid grid-h grid-h1"></div>
    <div class="grid grid-h grid-h2"></div>
    <div class="top-rule"></div>
    <div class="bottom-rule"></div>
    <div class="edge edge-left"></div>
    <div class="edge edge-right"></div>
    <div id="signal-core" class="signal-core">
      <div class="orbit orbit-halo"></div>
      <div id="orbit-outer" class="orbit orbit-outer"><span></span></div>
      <div id="orbit-mid" class="orbit orbit-mid"><span></span></div>
      <div class="orbit orbit-inner"></div>
      <div class="orbit range-ring"></div>
      <div class="orbit inner-detail"></div>
      <div class="orbit arc-detail"></div>
      <div class="radar-sweep"><div class="sweep-tail"></div><div class="sweep-ray"></div></div>
      <div class="contact contact-a"><span></span></div>
      <div class="contact contact-b"><span></span></div>
      <div class="contact contact-c"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(0deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(10deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(20deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(30deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(40deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(50deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(60deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(70deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(80deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(90deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(100deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(110deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(120deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(130deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(140deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(150deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(160deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(170deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(180deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(190deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(200deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(210deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(220deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(230deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(240deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(250deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(260deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(270deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(280deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(290deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(300deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(310deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(320deg);"><span></span></div>
      <div class="dial-tick dial-major" style="transform: rotate(330deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(340deg);"><span></span></div>
      <div class="dial-tick" style="transform: rotate(350deg);"><span></span></div>
      <div class="axis axis-h"></div>
      <div class="axis axis-v"></div>
    </div>
    <div id="scan-line" class="scan-line"></div>
    <div class="beacon beacon-top"></div>
    <div class="beacon beacon-bottom"></div>
    <div class="bracket bracket-tl"></div>
    <div class="bracket bracket-br"></div>
  </div>
</body>
</html>
